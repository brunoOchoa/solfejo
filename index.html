<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d1a" />
    <meta name="description" content="Prática de solfejo e leitura de partitura em Dó fixo." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg?v=2" type="image/svg+xml" />
    <script>
      // pinta o tema salvo antes do resto carregar (evita piscar a paleta padrão)
      try {
        var t = JSON.parse(localStorage.getItem('solfejo:themevars'));
        if (t && t.vars) {
          var r = document.documentElement;
          r.dataset.theme = t.theme; r.dataset.palette = t.palette; r.style.colorScheme = t.theme;
          for (var k in t.vars) r.style.setProperty(k, t.vars[k]);
        }
      } catch (e) {}
    </script>
    <title>Solfejo — leitura musical</title>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#/notas" aria-label="Solfejo, início">
        <span class="brand-mark" aria-hidden="true">𝄞</span>
        <h1>Solfejo</h1>
      </a>
      <nav id="nav" aria-label="Seções"></nav>
      <div class="hud" id="hud"></div>
    </header>
    <main id="view"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
